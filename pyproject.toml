[project]
name = "comfyui-dynamicprompts-lite"
version = "0.3.0"
description = "Maintained ComfyUI Dynamic Prompts fork with fast startup and manual wildcard refresh."
dependencies = [
    "dynamicprompts[feelinglucky]~=0.30.2",
]

[tool.ruff]
target-version = "py310"
select = [
    "B",
    "C",
    "COM",
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "C901", # Complexity
    "E501", # Line length
    "B019", # functools.lrucache
]
unfixable = [
    "B007", # Loop control variable not used within the loop body
]
